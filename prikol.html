<!DOCTYPE html>
<html lang = "ru">
<!--открывающий тег секции заголовка head
 метаинфа о страница(название, описание, кодировка)
 ссылки на внешние ресурсы(стили и иконки), содержимое
 не отображается напрямую на странице-->
<head>
    <!--(метатеги)кодировка, область просмотра, ширина страницы по ширине
    экрана устройства, и титл(тег заголовка страницы)
     - описание страницы(отображается
    в самой вкладке)-->
    <meta charset = "UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale= 1.0">
    <title> Видосики - Катюшккин сайт</title>
    <!--метатег описания страницы(используется для поиск систем,
    а также как заголовок при сохранении стр в закладки)-->

    <meta name="discription" content="видосики моего сайта">
    <!--подключение иконки для страницы href -путь-->
    <link rel = "icon" href = "../assets/favicon.ico" type="image/x-icon">
    <!--подключение стилей-->

    <link rel="stylesheet" href="styles.css">



</head>
<!--тело документа(все, что тут, попадает сюда
отображается в окне браузера)-->
<body>
<!--шапка сайта(логотип, навигация и др инфа,
 общая для всех страниц)-->
<header>
    <!--ссылка ведущая на главную стр-->
    <a href = "/">Катюшкин сайт</a>
    <!--навигация, nav - основная навигация-->
    <nav>
        <!--тег ненумерованного списка(unordered list)-->
        <ul>
            <!--List item(li) - элемент списка:
            внутри: ссылка(<a>) на страницу
            index.html c анкором "главная"-->
            <li><a href="index.html">Вернуться на главную</a></li>
            <li><a href="contacts.html">Контакты</a></li>
            <li><a href="about.html">О нас</a></li>
            <li><a href="pricol.html">Видосики</a></li>
        </ul>
    </nav>
</header>
<!--тег основной страницы, уникальное содержимое-->

<main>
    <!--блок навигации, путь от гл до тек стр-->
    <nav aria-label="хлебные крошки">
        <!--ссылка на главную страницу
         и стрелка для визуализации-->
        <a href="index.html">Главная</a> ->
        <!--тег для текстового контейнера
        (здесь исп для обозначения страницы
         в цепочке хлебных крошек)-->
        <span>Видосики</span>
    </nav>
    <!--заголовок первого уровня
    (ЕДИНСТВЕННЫЙ НА СТРАНИЦЕ)-->
    <h1>Видосики</h1>
    <!--тег секции(раздела)
    группирует логически связанный контент-->
    <section>
        <!--заголовок 2 уровня-->
        <h2> Мои видосики </h2>
        <!--абзац текста p - paragraph-->
        <p> Они крутые... </p>



    </section>
    <section>
        <!--заголовок 2 уровня-->
        <h2> Наша команда </h2>
        <!--абзац текста p - paragraph-->
        <p> Кот Барс и я </p>
        <p>блаблабла</p>
    </section>
    <!--кнопка открытия модалки id = "openDialog"
    уникально идентифицирует этот элемент для стилизации и джава
    скрипт  type="button" явно указывает, что это кнопка
    (по умолчанию кнопка внутри формы имеет тип submit-->
    <button id = "openDialog" type="button">тык</button>
    <!--Семантический тег <dialog> для создания модального окна.
     Атрибут aria-labelledby="dialogTitle" связывает диалог с его
      заголовком (<h2 id="dialogTitle">...),
     что помогает скринридерам понять, о чем это окно.-->
    <dialog id = "contactDialog" aria-labelledby="dialogTitle" >
        <!--Заголовок для модального окна с id,
        на который ссылается aria-labelledby-->
        <h2 id="dialogTitle"> Обратная связь</h2>
        <!--Тег формы. method="dialog"
        указывает, что при отправке формы должно
         закрываться модальное окно
          (альтернатива get/post).
          novalidate отключает встроенную
           браузерную валидацию полей, чтобы ее
        можно было реализовать на JavaScript.-->
        <form id = "contactForm" method = "dialog" novalidate>
            <!--Тег подписи к полю ввода.
             Атрибут for="name" связывает эту подпись с полем,
             у которого id="name". При клике на подпись
             курсор фокусируется на связанном поле.-->
            <label for="name">Имя</label>
            <!-- required — обязательное для заполнения.
             minlength="2" — минимальная длина 2 символа.
             autocomplete="given-name" — подсказывает браузеру,
            что это поле для имени, и он может предложить
             его автозаполнение.-->
            <input id = "name" name = "name" type = "text"
                   required minlength = "2" autocomplete="given-name">
            <label for="email">E-mail</label>
            <!--type="email" включает
            базовую проверку формата email на стороне браузера.-->
            <input id="email" name="email" type="email" placeholder="t@mail.com"
                   required autocomplete="email">
            <label for = "phone" >телефончик</label>
            <!--type="tel" — оптимизирует ввод для телефонов.
             inputmode="tel" — на мобильных устройствах показывает
              цифровую клавиатуру. pattern="..." — задает регулярное
               выражение для проверки формата номера.
                aria-describedby="phoneHelp" — связывает поле с подсказкой
             (<small id="phoneHelp">), чтобы скринридеры зачитали -->
            <input id = "phone" name = "phone" type = "tel"
                   inputmode="tel" autocomplete="tel"
                   aria-describedby="phoneHelp"
                   placeholder="+7 (___) ___-__-__"
                   required pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$">
            <small id="phoneHelp">Формат: +7 (900) 000-00-00</small>
            <label for="date">Дата йоу</label>
            <input id="date" name="date" type="date">
            <label for="topic">Тема</label>
            <!--Раскрывающийся список (селект).-->
            <select id="topic" name="topic" required>
                <!--Другие варианты выбора. Если атрибут value не указан,
                значением будет текст внутри тега ("Вопрос", "Заказ").-->
                <option value="">Выберите тему</option>
                <option>Вопрос??</option>
                <option>Заказ?!!</option>
            </select>
            <!--Многострочное текстовое поле.
             rows="4" задает начальную высоту в 4 строки.-->
            <label for="message">Сообщение</label>

            <textarea id="message" name="message"
                      rows="2" required></textarea>
            <!--Универсальный блочный контейнер (div)
             с классом form-actions для группировки кнопок.
            Класс нужен для последующего применения стилей CSS.-->
            <div class="form-actions">
                <!--тип button предотвращает отправку-->
                <button type="button" id="closeDialog">Закрыть</button>
                <!--тип submit отправляет форму по умолчанию-->
                <button type="submit">Отправить</button>
            </div>
            </form>
        </dialog>
</main>
<!--подвалище(авторские права, контакты и навигация)-->
<footer>
    <!--Абзац с копирайтом.
    Символ &copy; — это HTML-сущность,
     которая отображается как ©.-->
    <p>&copy; 2025 Катюшкин сайт. Все права защищены.</p>
    <p>Телефон: +7 (123) 456-78-90</p>
</footer>




<script src="main.js"></script>
</body>
</html>
